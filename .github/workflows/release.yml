name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            runner: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: Linux (x64)
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - name: Windows (x64)
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            args: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches app version
        shell: bash
        run: >-
          node -e "const version = require('./src-tauri/tauri.conf.json').version;
          if (process.env.GITHUB_REF_NAME !== 'v' + version)
          throw new Error('Release tag must be v' + version + ', got ' + process.env.GITHUB_REF_NAME)"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Blindwave ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your platform below.

            FFmpeg with FFplay must be installed separately for audio playback.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
